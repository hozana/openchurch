jobs:
  - hozana/build-via-n8n:
      docker_image_name: openchurch-backend
      target: prod
      resource_class: hozana/hetzner
  - hozana/trivy-audit:
      docker_image_name: openchurch-backend
      severity: CRITICAL,HIGH
      resource_class: hozana/hetzner
      requires:
        - hozana/build-via-n8n
  - quality-checks:
      requires:
        - hozana/build-via-n8n
  - test-suite:
      name: full-tests
      suite-name: Full test suite
      artifact-name: full-coverage
      requires:
        - hozana/build-via-n8n
        - quality-checks
  - hozana/deploy-to-swarm:
      name: deploy-<< matrix.service_name >>
      docker_image_name: openchurch-backend
      resource_class: hozana/hetzner
      matrix:
        parameters:
          service_name:
            - openchurch_backend
            - openchurch_cli
      filters:
        branches:
          only:
            - master
            - main
      requires:
        - full-tests
        - hozana/trivy-audit
  - hozana/deploy-to-swarm:
      name: deploy-<< matrix.service_name >>
      docker_image_name: openchurch-backend
      resource_class: hozana/hetzner
      matrix:
        parameters:
          service_name:
            - openchurch-prod_backend-prod
            - openchurch-prod_cli-prod
      filters:
        branches:
          only:
            - prod
      requires:
        - full-tests
        - hozana/trivy-audit

executor: php-executor
working_directory: ~/project
steps:
  - checkout:
      path: ~/project
  - run:
      name: Install PHP extensions
      command: |
        apk add --no-cache --virtual .build-deps $PHPIZE_DEPS libxslt-dev gmp-dev icu-dev
        docker-php-ext-install xsl gmp intl
        docker-php-ext-enable xsl gmp intl
  - run:
      name: Install dependencies
      command: composer install --no-interaction --prefer-dist --no-progress --no-scripts
  - run:
      name: Security check
      command: composer audit --abandoned=ignore

executor: php-executor
working_directory: ~/project
steps:
  - checkout:
      path: ~/project
  - run:
      name: Print PHP version
      command: php -v
  - run:
      name: Install PHP extensions
      command: |
        apk add --no-cache --virtual .build-deps $PHPIZE_DEPS libxslt-dev gmp-dev icu-dev
        docker-php-ext-install xsl gmp intl
        docker-php-ext-enable xsl gmp intl
  - run:
      name: Install dependencies
      command: composer install --no-interaction --prefer-dist --no-progress --no-scripts
  - run:
      name: Run PHPStan
      command: composer phpstan
  - run:
      name: php-cs-fixer-check
      command: php vendor/bin/php-cs-fixer fix --dry-run --diff
  - run:
      name: rector (dry-run)
      command: vendor/bin/rector process --dry-run
  - run:
      name: composer validate
      command: composer validate --strict
  - run:
      name: 'lint:container'
      command: php bin/console lint:container
  - run:
      name: 'lint:yaml'
      command: php bin/console lint:yaml config src
  - run:
      name: 'lint:twig'
      command: php bin/console lint:twig templates
